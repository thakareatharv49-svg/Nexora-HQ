name: Deploy Nexora HQ

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "tests/static-site.test.cjs"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate frontend JavaScript
        run: node --check apps/web/app.js
      - name: Run frontend regression tests
        run: node --test tests/static-site.test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate static assets
        run: |
          test -s apps/web/index.html
          test -s apps/web/styles.css
          test -s apps/web/app.js
          grep -q 'Nexora HQ' apps/web/index.html
          grep -q 'Not connected' apps/web/index.html
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
