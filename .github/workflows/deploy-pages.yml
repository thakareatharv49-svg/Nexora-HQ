name: Deploy Nexora HQ

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate static assets
        run: |
          test -s apps/web/index.html
          test -s apps/web/styles.css
          test -s apps/web/app.js
          grep -q 'Nexora HQ' apps/web/index.html
          grep -q 'Not connected' apps/web/index.html
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
